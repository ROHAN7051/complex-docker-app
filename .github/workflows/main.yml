name: Deploy Complex App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository code
      - uses: actions/checkout@v4

      # Step 2: Authenticate with Docker Hub using stored credentials
      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Step 3: Build test Docker image using development Dockerfile for testing
      - name: Build test image
        run: docker build -t rohansharma029/multi-client -f ./client/Dockerfile.dev ./client
      # Step 4: Run tests on the built image
      - name: Run tests
        run: docker run -e CI=true rohansharma029/multi-client npm test
      # Step 5: Build production Docker images
      - name: Build production images
        run: |
          docker build -t rohansharma029/multi-client ./client
          docker build -t rohansharma029/multi-server ./server
          docker build -t rohansharma029/multi-worker ./worker
          docker build -t rohansharma029/multi-nginx ./nginx
      # Step 6: Push production images to Docker Hub
      - name: Push production images to Docker Hub
        run: |
          docker push rohansharma029/multi-client
          docker push rohansharma029/multi-server
          docker push rohansharma029/multi-worker
          docker push rohansharma029/multi-nginx
      # Step 7: Deploy to AWS Elastic Beanstalk
      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: multi-docker
          environment_name: MultiDocker-env
          region: us-east-1
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip
