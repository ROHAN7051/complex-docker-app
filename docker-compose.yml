version: "3"
services:
  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_PASSWORD=postgres_password

  redis:
    image: redis:latest

  client:
    image: "rohansharma029/multi-client"
    hostname: client

  server:
    image: "rohansharma029/multi-server"
    hostname: api
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PGUSER=postgres
      - PGHOST=postgres
      - PGDATABASE=postgres
      - PGPASSWORD=postgres_password
      - PGPORT=5432

  worker:
    image: "rohansharma029/multi-worker"
    hostname: worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  nginx:
    image: "rohansharma029/multi-nginx"
    hostname: nginx
    ports:
      - "80:80"
    links:
      - client
      - server
